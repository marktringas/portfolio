<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>M. Tussy — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0a0b0d;
    overflow: hidden; /* the game IS the page — no page scroll */
  }
  #game-container {
    position: fixed;
    inset: 0;
  }
  /* love.js requires the canvas to have zero border/padding or mouse
     coordinates will be wrong — do not add either to #canvas */
  #canvas {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
    display: block;
    border: 0;
    padding: 0;
    outline: none;
  }
  #loadingCanvas { display: none; }

  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0a0b0d;
    color: #8cff6b;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.05em;
    z-index: 10;
  }
  #loading.hidden { display: none; }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="800" height="600" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <canvas id="loadingCanvas" width="800" height="600"></canvas>
</div>

<div id="loading">loading build…</div>

<!-- enables SharedArrayBuffer on static hosts (GitHub Pages, itch.io, etc.)
     that can't set the Cross-Origin-Opener/Embedder-Policy headers love.js
     needs — must load before game.js/love.js. On first visit this triggers
     one automatic reload while the service worker registers; that's expected. -->
<script src="coi-serviceworker.js"></script>
<script type="text/javascript">
  window.onload = function () { window.focus(); };
  window.onclick = function () { window.focus(); };

  // stop arrow keys / space from scrolling the (hidden) page while playing
  window.addEventListener("keydown", function (e) {
    if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
  }, false);

  var loadingEl = document.getElementById('loading');
  var canvasEl = document.getElementById('canvas');

  var Module = {
    arguments: ["./game.love"],
    INITIAL_MEMORY: 67108864,
    printErr: console.error.bind(console),
    canvas: (function () {
      canvasEl.addEventListener("webglcontextlost", function (e) {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);
      return canvasEl;
    })(),
    totalDependencies: 0,
    remainingDependencies: 0,
    setStatus: function (text) {
      if (!text && Module.remainingDependencies === 0) {
        loadingEl.classList.add('hidden');
      }
    },
    monitorRunDependencies: function (left) {
      this.remainingDependencies = left;
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'loading…' : '');
    }
  };

  window.onerror = function () {
    loadingEl.textContent = 'something went wrong — check the console, then reload';
  };

  var applicationLoad = function (e) { Love(Module); };
</script>
<script type="text/javascript" src="game.js"></script>
<script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>

</body>
</html>
